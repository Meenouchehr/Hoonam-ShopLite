version: "3.3"

services:
  minio:
    image: minio/minio
    container_name: minio
    expose:
      - 9000
      - 9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - './minio/data:/data'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --console-address ":9001" /data

  db:
    container_name: Shoplite-db
    image: postgres:13-alpine
    volumes:
      - ./postgre/data:/var/lib/postgresql/data
    expose:
      - 5432
    ports:
    - 5432:5432
    env_file:
      - ./envs/dev/postgre/.env

    restart: always
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: dockerfiles/dev/django/Dockerfile
    container_name: Shoplite-backend
    #command: sh -c "yes | python manage.py makemigrations  && yes | python manage.py migrate  &&  yes | python manage.py collectstatic --noinput && yes | pip install --root-user-action=ignore debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000 --nothreading --noreload"
    command: sh -c "yes | python manage.py makemigrations  && yes | python manage.py migrate  &&  yes | python manage.py collectstatic --noinput && yes | python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./core:/usr/app
    ports:
      - 8000:8000
      - 5678:5678
    expose:
      - 8000
    env_file:
      - ./envs/dev/django/.env
    restart: always
    depends_on:
      - db
    networks:
      - shared
      - internal

  mongo:
      container_name: mongo
      image: mongo
      restart: unless-stopped
      ports:
        - 27017:27017
      environment:
        MONGO_INITDB_DATABASE: main
        MONGO_INITDB_ROOT_USERNAME: root
        MONGO_INITDB_ROOT_PASSWORD: Mam69853301135803421#
      volumes:
        - ./mongo/data:/var/lib/mongo/data
      networks:
        - internal


networks:
  shared:
    name: shared
  internal:

