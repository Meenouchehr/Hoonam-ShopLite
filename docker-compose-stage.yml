version: "3.3"

services:

  backend:
    build:
      context: .
      dockerfile: dockerfiles/stage/django/Dockerfile
    container_name: APP_NAME-backend
    command: sh -c "python3 manage.py makemigrations --noinput && \
                    python3 manage.py migrate --noinput && \
                    python3 manage.py collectstatic --noinput && \
                    gunicorn --bind 0.0.0.0:8000 core.wsgi:application"
    volumes:
      - ./core:/usr/app
      - static_volume:/usr/app/static
    expose:
      - 8000
    ports:
      - 80:8000
    env_file:
      - ./envs/stage/django/.env
    restart: always
    networks:
        - shared


networks:
  shared:
    name: shared
    external: true
  
volumes:
  static_volume:
    name: static_volume
    external: true